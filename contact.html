<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Amar Singh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            padding: 100px 0;
            display: flex;
            justify-content: center;
        }
        .contact-form-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.5));
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 600px;
        }
        .contact-form-container h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            margin-bottom: 40px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e85d22;
        }
        .submit-btn {
            width: 100%;
            background: #e85d22;
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #f7682d;
        }
    </style>
</head>
<body>
    <div id="animation-container">
        <canvas id="hero-lightpass"></canvas>
    </div>

    <div id="content-wrapper">
        <header>
            <a href="index.html" class="logo" style="color: white; text-decoration: none;">Amarsweb</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="services.html">Services</a>
                <a href="testimonials.html">Testimonials</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <a href="contact.html" class="btn">Start a Project <span>↗</span></a>
        </header>

        <section class="hero container">
            <div class="hero-bg-text">CONTACT</div>
            <div class="hero-content">
                <!-- Keep hero empty for background -->
            </div>
        </section>

        <section class="contact-section container">
            <div class="contact-form-container">
                <h2>Let's work together</h2>
                <p style="text-align: center; color: #aaa; margin-bottom: 30px; font-size: 16px;">
                    Or reach out directly:<br>
                    <a href="mailto:amarfzd12@gmail.com" style="color: #e85d22; text-decoration: none; font-weight: 500;">amarfzd12@gmail.com</a> &nbsp;|&nbsp; 
                    <a href="tel:7704913136" style="color: #e85d22; text-decoration: none; font-weight: 500;">7704913136</a>
                </p>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Project Details</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
                    <div id="formMessage" style="margin-top: 20px; text-align: center; display: none; font-size: 14px; font-weight: 500;"></div>
                </form>
            </div>
        </section>

        <footer class="site-footer">
            <div class="container footer-content">
                <div class="logo">Amarsweb</div>
                <p>&copy; 2024 Amar Singh. All rights reserved.</p>
                <div class="social-links">
                    <a href="#">Twitter</a>
                    <a href="#">LinkedIn</a>
                    <a href="#">Dribbble</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('formMessage');
            
            // Get data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };
            
            // UI Loading state
            btn.textContent = 'Sending...';
            btn.style.opacity = '0.7';
            msg.style.display = 'none';

            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                btn.textContent = 'Send Message';
                btn.style.opacity = '1';
                msg.style.display = 'block';
                if(data.status === 'success') {
                    msg.style.color = '#4ade80'; // Success green
                    msg.textContent = 'Thank you! Your message has been sent successfully.';
                    document.getElementById('contactForm').reset();
                } else {
                    msg.style.color = '#f87171'; // Error red
                    msg.textContent = 'Oops! Something went wrong.';
                }
            })
            .catch(error => {
                btn.textContent = 'Send Message';
                btn.style.opacity = '1';
                msg.style.display = 'block';
                msg.style.color = '#f87171';
                msg.textContent = 'Network error. Please try again later.';
            });
        });
    </script>
    <script src="vercel-analytics.js"></script>
</body>
</html>
